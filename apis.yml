apis:
- aid: accessibe:partners-api
  name: accessiBe Partners API License
  description: 'The Partners API allows accessiBe partners to manage accessWidget
    licenses programmatically across their accounts, with full control over the license
    lifecycle: create, retrieve, list, filter and update licenses, plus asynchronous
    batch create and batch update of up to 150 licenses per request with a batch status
    endpoint. Authentication is a per-account API key supplied in the x-api-key header;
    the account must be enabled as a partner account. Listing supports cursor pagination
    (nextToken + limit) and filtering by status and domain, and the batch endpoints
    accept an Idempotency-Key header so a request is processed only once.'
  humanURL: https://dashboard.accessibe.com/api/v1/partners/docs
  baseURL: https://dashboard.accessibe.com/api/v1/partners
  tags:
  - Licenses
  - Accessibility
  - Partners
  - Account
