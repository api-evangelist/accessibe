- aid: accessibe:accessflow-mcp
  name: accessFlow MCP Server
  description: 'The accessFlow Model Context Protocol server connects AI clients such
    as GitHub Copilot and Cursor directly to accessFlow accessibility data. It exposes
    three tools — getMostUrgentIssues, getIssueRemediation and resolveIssue — over
    both a local stdio transport (npx accessflow-mcp-server, configured with API_KEY
    and DOMAIN) and a hosted remote HTTP transport at https://flow-mcp.accessibe.com/mcp
    authenticated with a bearer AI MCP token plus an X-Domain header. It works against
    both accessFlow platform audits and SDK-based audits selected via the auditSource
    parameter.'
  humanURL: https://www.npmjs.com/package/accessflow-mcp-server
  baseURL: https://flow-mcp.accessibe.com/mcp
  tags:
  - MCP
