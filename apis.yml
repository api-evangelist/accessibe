aid: accessibe
name: accessiBe
description: 'accessiBe is a web accessibility technology company whose products help
  organizations make websites and web applications usable by people with disabilities
  and compliant with WCAG, the ADA, Section 508, AODA and the European Accessibility
  Act. Its portfolio spans accessWidget (an AI-driven remediation layer and end-user
  accessibility interface installed via an embed script), accessScan (a free single-URL
  compliance checker), accessFlow (a developer-first accessibility testing and monitoring
  platform with an SDK for Playwright, Cypress and Selenium plus CI/CD integrations),
  and accessServices (expert audits, user testing by people with disabilities, file
  and PDF remediation, and VPAT authoring). Developer surfaces include a documented
  Partners API for programmatic accessWidget license management and a first-party
  accessFlow MCP server that connects IDE AI assistants to accessibility audit findings
  and remediation guidance.'
