generated: '2026-07-31'
method: searched
status: published
source: https://registry.npmjs.org/accessflow-mcp-server
docs: https://accessibe.com/blog/knowledgebase/accessflows-sdk-and-mcp
support_docs: https://support.accessibe.com/hc/en-us/articles/30359809092626-How-to-connect-AI-clients-to-accessFlow-with-MCP-Beta
server:
  name: flow-mcp
  product: accessFlow
  package: accessflow-mcp-server
  version: 2.3.9
  maturity: beta
  transports:
  - transport: stdio
    command: npx
    args: ['-y', accessflow-mcp-server]
    env:
      API_KEY: accessFlow AI MCP token (required)
      DOMAIN: the domain of the application being analyzed (required)
  - transport: http
    url: https://flow-mcp.accessibe.com/mcp
    headers:
      Authorization: Bearer <FLOW_MCP_API_KEY> (required)
      X-Domain: the domain of the application being analyzed (required)
authentication:
  type: bearer-token
  token_type: AI MCP token
  issuance: accessFlow Profile menu - Token management - Generate token - AI MCP token
  note: The token is shown once at creation and cannot be retrieved again.
probe:
  fetched: '2026-07-31'
  url: https://flow-mcp.accessibe.com/mcp
  method: POST tools/list (jsonrpc 2.0)
  http_status: 401
  result: auth-gated
  note: Live tools/list requires a bearer token, so per-tool inputSchema could not be
    introspected anonymously. The tool set and parameters below are transcribed from
    the published package documentation, not invented.
tools:
- name: getMostUrgentIssues
  description: Retrieves the most critical accessibility issues, prioritized by severity
    (Extreme, High, Medium, Low), then by site impact (number of locations affected
    across the site), then by page impact (occurrences on individual pages).
  returns: JSON data with structured issue information including severity, WCAG level,
    occurrence counts, and unique identifiers.
  parameters:
  - name: auditSource
    type: enum
    required: false
    values: [PLATFORM, SDK]
    default: PLATFORM
    description: PLATFORM returns issues from the latest accessFlow platform audit;
      SDK returns issues from the specified SDK audit.
  - name: commitId
    type: string
    required: when auditSource is SDK
    description: The commit ID for the SDK audit results to retrieve.
  - name: repo
    type: string
    required: false
    description: Repository URL or identifier for the SDK audit, to narrow results.
  - name: branch
    type: string
    required: false
    description: Branch name for the SDK audit, to narrow results.
- name: getIssueRemediation
  description: Provides detailed remediation guidance for a specific accessibility
    issue — problem summary and WCAG references, the current problematic code, suggested
    code fixes with examples, step-by-step remediation instructions, and links to
    tutorials.
  parameters:
  - name: issueDisplayName
    type: string
    required: true
    description: The unique identifier for the accessibility issue (for example
      Decorative-Content-6d277a13ba).
  - name: auditSource
    type: enum
    required: false
    values: [PLATFORM, SDK]
    default: PLATFORM
  - name: commitId
    type: string
    required: when auditSource is SDK
- name: resolveIssue
  description: Marks the specified issue as resolved in accessFlow. If the next audit
    still detects the issue, it is reopened automatically.
  parameters:
  - name: issueDisplayName
    type: string
    required: true
  - name: auditSource
    type: enum
    required: false
    values: [PLATFORM, SDK]
    default: PLATFORM
  - name: commitId
    type: string
    required: when auditSource is SDK
supported_clients:
- VS Code Copilot
- Cursor
- Any MCP-compatible client
well_known:
  '/.well-known/oauth-authorization-server': 404
  '/.well-known/oauth-protected-resource': 404
  note: The server publishes no OAuth discovery documents; authentication is a static
    bearer token, not an OAuth flow.
