openapi: 3.0.0
info:
  title: Partners API License
  version: 1.0.1
  description: |
    This API allows partners to manage access widget licenses for their accounts.
    The API requires an API key to authenticate the account and access the endpoints.
    The API key must be included in the `x-api-key` header of the request.
    The API key is unique for each account and can be found in the Customer Portal in Account Settings - Subscriptions API/CSV access.
    The account must be enabled as a partner account to access the endpoints.
    Each account has a unique accountId which can be found in the Customer Portal in Account Settings - Account and user details.
  termsOfService: https://accessibe.com/terms-of-service
  contact:
    name: API Support
    url: https://support.accessibe.com/hc/en-us
    email: support@accessibe.com
servers:
  - url: /api/v1/partners
components:
  parameters:
    ExpandSettingsParam:
      name: expand[]
      in: query
      required: false
      schema:
        type: string
        enum: [settings]
        description: "Expands extra fields in the response. If present, includes `maxImagesReached`, `maxImagesLimit`, and the `settings` object (which related to customization settings). `maxImagesReached` indicates the maximum allowed images is exceeded."
  securitySchemes:
    X-API-Key:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key generated for the account

  schemas:
    License:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date-time
        relatedAccountId:
          type: string
        domain:
          type: string
        status:
          enum:
            - active
            - grace
            - expired
            - trial
        price:
          type: number
        licenseType:
          type: string
        plan:
          $ref: "#/components/schemas/Plan"
        relatedBillingId:
          type: string
          nullable: true
        statementDate:
          type: string
          format: date-time
        dateTrialExpires:
          type: string
          format: date-time
        datePlanExpires:
          type: string
          format: date-time
          nullable: true
        datePlanFirstActivated:
          type: string
          format: date-time
          nullable: true
        lastSubscriptionPaymentId:
          type: string
          nullable: true
        enableGoogleAnalytics:
          type: boolean
        enableRemediationReport:
          type: boolean
        monthly:
          type: boolean
        autoRenew:
          type: boolean
        contactName:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        contactCountry:
          type: string
          nullable: true
        settings:
          $ref: "#/components/schemas/LicenseSettings"
          description: Widget settings object
        maxImagesReached:
          type: boolean
          readOnly: true
          description: Indicates if the maximum allowed images have been reached for this license
        maxImagesLimit:
          type: number
          readOnly: true
          description: Shows the maximum images limit for this license

    Plan:
      type: object
      nullable: true
      properties:
        name:
          type: string
        planSKU:
          type: number

    CreateLicense:
      type: object
      required:
        - domain
        - planSKU
      properties:
        domain:
          type: string
          example: "example.com"
          description: "Domain name for which the license is being created"
        planSKU:
          type: number
          enum: [1, 2, 3, 5, 21, 22, 23]
          example: 1
          description: "Plan SKU for the license"
        contactName:
          type: string
          example: "John Doe"
          description: "Full name of the contact for this license"
        contactEmail:
          type: string
          example: "johndoe@accessibe.com"
          description: "Contact email address for this license"
        contactPhone:
          type: string
          example: "5551234567"
          description: "Contact phone number for this license"
        contactCountryCode:
          type: string
          example: "US"
          description: "Contact country code for this license"
        discountEnabled:
          description: "Set to true to enable discounts for the account. Set to false to get commissions instead of discounts. The parameter activate below must be set to true"
          type: boolean
          default: true
        monthly:
          type: boolean
          description: "For monthly subscription can pass it as true, else it will be yearly"
          default: false
        activate:
          type: boolean
          description: "Activate the license, need to have in the account allowActivationByApi set to true"
          default: false
        longTrial:
          type: boolean
          description: "Assign a long trial period for 30 days, need to have in the account allowLongTrialByApi set to true"
          default: false
        settings:
          $ref: "#/components/schemas/CreateSettings"
          nullable: true
          description: |
            Widget settings. All fields inside `settings` are optional.
            If any field is `null`, that specific field set to the default setting.
            If `default` is `true` within this object, **all** fields revert to default regardless of other values.

    UpdateLicense:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
          description: "domain of an exiting license"
          example: example.com
        newDomain:
          type: string
          description: "New domain for the license, you can update only if you have the allowTransferByApi set to true"
          example: test.com
        planSKU:
          type: number
          enum: [1, 2, 3, 5, 21, 22, 23]
          example: 1
          description: "Plan SKU for the license."
        contactName:
          type: string
          description: "New full name of contact for the license"
          example: John Doe
        contactEmail:
          type: string
          description: "New contact email for the license"
          example: johndoe@accessibe.com
        contactPhone:
          type: string
          description: "New contact phone for the license"
          example: 5551234567
        contactCountryCode:
          type: string
          description: "New contact country code for the license"
          example: US
        discountEnabled:
          description: "Set to true to enable discounts for the account. Set to false to get commissions instead of discounts. The parameter activate below must be set to true."
          type: boolean
          default: true
        monthly:
          type: boolean
          description: "For monthly subscription can pass it as true, else it will be yearly"
          default: false
        activate:
          type: boolean
          description: "Activate the license, need to have in the account allowActivationByApi set to true"
          default: false
        disable:
          type: boolean
          description: "Disable the license, need to have in the account allowDisableByApi set to true"
          default: false
        settings:
          $ref: "#/components/schemas/UpdateSettings"
          nullable: true
          description: |
            Widget settings. All fields inside `settings` are optional.
            If any field is `null`, that specific field set to the default setting.
            If `default` is `true` within this object, all fields revert to default regardless of other values.

    GetBatchStatus:
      type: object
      properties:
        batchId:
          type: string
        hasErrors:
          type: boolean
        operation:
          type: string
          enum:
            - create
            - update
        status:
          type: string
          enum:
            - processing
            - completed
        successLicenses:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
              getLicenseURL:
                type: string
              licenseId:
                type: string
        failedLicenses:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
              message:
                type: string
        total:
          type: integer
          description: The total number given in the request
        totalFailures:
          type: integer
        totalSuccesses:
          type: integer
    LicenseCreateOrUpdateResponse:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date-time
        relatedAccountId:
          type: string
        domain:
          type: string
        status:
          enum:
            - active
            - grace
            - expired
            - trial
        price:
          type: number
        licenseType:
          type: string
        plan:
          $ref: "#/components/schemas/Plan"
        relatedBillingId:
          type: string
          nullable: true
        statementDate:
          type: string
          format: date-time
        dateTrialExpires:
          type: string
          format: date-time
        datePlanExpires:
          type: string
          format: date-time
          nullable: true
        datePlanFirstActivated:
          type: string
          format: date-time
          nullable: true
        lastSubscriptionPaymentId:
          type: string
          nullable: true
        enableGoogleAnalytics:
          type: boolean
        enableRemediationReport:
          type: boolean
        monthly:
          type: boolean
        autoRenew:
          type: boolean
        contactName:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        contactCountry:
          type: string
          nullable: true

