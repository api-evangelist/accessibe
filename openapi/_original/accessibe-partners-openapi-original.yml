  responses:
    NotFound:
      description: License not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
    BadRequestError:
      description: The request is invalid. Any field could potentially be the cause.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: planSKU can only be 1, 2, 3, 5, 21, 22, 23
    UnauthorizedError:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Missing x-api-key in headers
    ForbiddenError:
      description: Account does not have access to do this operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                enum:
                  - Could not find a partner account with the provided API key
                  - Account does not have access to partners API
    ConflictError:
      description: Domain already being used
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                enum:
                  - Domain already being used
                  - Domain already exists in account
