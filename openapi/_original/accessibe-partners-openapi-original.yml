paths:
  /accounts/{accountId}/access-widget-licenses/{licenseId}:
    get:
      summary: Get an accessWidget license
      description: |
        Gets the details of the specified accessWidget license for the specified account ID.
        Use GET /accounts/{accountId}/access-widget-licenses and filter by domain to get the licenseId for a specific domain.

        This endpoint requires the `x-api-key` header for authentication. The key must match the API key associated with the specified account. The account must also be a partner account.
      security:
        - X-API-Key: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the account. You can check your ID [here](https://dashboard.accessibe.com/app/account).
          example: 6655ffde924acc9586252c9e
        - name: licenseId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the license.
          example: 6655ffdaaf3c1a7b866ad60b
        - $ref: "#/components/parameters/ExpandSettingsParam"
      responses:
        "200":
          description: License found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/License"
              examples:
                LicenseExample:
                  $ref: "#/components/examples/SingleLicenseExample"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: License not found
          content:
            application/json:
              schema:
                $ref: "#/components/responses/NotFound"
              examples:
                notFoundExample:
                  value:
                    success: false
                    message: License not found

    patch:
      summary: Update an accessWidget license
      description: |
        Updates the details of the specified accessWidget license for the specified account. Any parameters not provided will be left unchanged. 
        Use GET /accounts/{accountId}/access-widget-licenses and filter by domain to get the licenseId for a specific domain.

        planSKU is the type of plan for the license where: 
        
        1 = Standard, 2 = Advanced Plus, 3 = Enterprise, 5 = Advanced,
        21 = Micro, 22 = Growth, 23 = Scale

        Note: If you pass null for a specific field in `settings` (for example `leadColor: null`), that field set to the default value.
      security:
        - X-API-Key: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the account. You can check your ID [here](https://dashboard.accessibe.com/app/account)
          example: 6655ffde924acc9586252c9e
        - name: licenseId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the license.
          example: 6655ffdaaf3c1a7b866ad60b
      requestBody:
        description: The license object to update.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLicense"
            examples:
              LicenseUpdateRequestExample:
                $ref: "#/components/examples/LicenseUpdateRequestExample"
      responses:
        "200":
          description: License updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/LicenseCreateOrUpdateResponse"
              examples:
                LicenseCreateOrUpdateResponseExample:
                  $ref: "#/components/examples/LicenseCreateOrUpdateResponseExample"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictError"

  /accounts/{accountId}/access-widget-licenses:
    get:
      summary: Get accessWidget licenses
      description: |
        Gets all the accessWidget licenses for the specified account.

        This endpoint requires the `x-api-key` header for authentication. The key must match the API key associated with the specified account. The account must also be a partner account.
      security:
        - X-API-Key: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the account. You can check your ID [here](https://dashboard.accessibe.com/app/account).
          example: 6655ffde924acc9586252c9e
        - $ref: "#/components/parameters/ExpandSettingsParam"
        - name: nextToken
          in: query
          schema:
            type: string
          description: Token used in pagination to retrieve the next set of results. Make the call again using the returned token to retrieve the next results.
          example: 63fe209a096fed10ca0c08a2
          default: null
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            description: The number of results to return.
            example: 3
            default: 10
            maximum: 150
        - name: status
          in: query
          schema:
            enum:
              - active
              - trial
              - expired
              - grace
          description: Filter the results by license status.
          example: active
        - name: domain
          in: query
          schema:
            type: string
          description: Filter the results by domain.
          example: example.com

      responses:
        "200":
          description: The list of licenses found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: The total number of licenses without any filters.
                      licenses:
                        type: array
                        maximum: 150
                        minimum: 1
                        items:
                          $ref: "#/components/schemas/License"
                      nextToken:
                        type: string
                        nullable: true
              examples:
                LicenseExample:
                  $ref: "#/components/examples/ManyLicensesExample"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: No licenses were found
          content:
            application/json:
              schema:
                $ref: "#/components/responses/NotFound"
              examples:
                notFoundExample:
                  value:
                    success: false
                    message: Licenses not found

    post:
      summary: Create an accessWidget license
      description: |
        Creates a new accessWidget license for the specified account.

        This endpoint requires the `x-api-key` header for authentication. The key must match the API key associated with the specified account. The account must also be a partner account.

        planSKU is the type of plan for the license where: 
        
        1 = Standard, 2 = Advanced Plus, 3 = Enterprise, 5 = Advanced,
        21 = Micro, 22 = Growth, 23 = Scale
      security:
        - X-API-Key: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the account. You can check your ID [here](https://dashboard.accessibe.com/app/account).
          example: 6655ffde924acc9586252c9e
      requestBody:
        description: License object to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLicense"
            examples:
              LicenseRequestExample:
                $ref: "#/components/examples/LicenseRequestExample"
      responses:
        "201":
          description: License created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/LicenseCreateOrUpdateResponse"
              examples:
                LicenseCreateOrUpdateResponseExample:
                  $ref: "#/components/examples/LicenseCreateOrUpdateResponseExample"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/responses/NotFound"
              examples:
                notFoundExample:
                  value:
                    success: false
                    message: Account not found
                    data: []
        "409":
          $ref: "#/components/responses/ConflictError"

  /accounts/{accountId}/access-widget-licenses/batch-create:
    post:
      summary: Create multiple accessWidget licenses
      description: |
        Creates multiple accessWidget licenses for the specified account. The maximum number of licenses that can be created in a single request is 150.

        This endpoint requires the `x-api-key` header for authentication. The key must match the API key associated with the specified account. The account must also be a partner account.

        planSKU is the type of plan for the license where:
        
        1 = Standard, 2 = Advanced Plus, 3 = Enterprise, 5 = Advanced,
        21 = Micro, 22 = Growth, 23 = Scale
      security:
        - X-API-Key: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the account. You can check your ID [here](https://dashboard.accessibe.com/app/account).
          example: 6655ffde924acc9586252c9e
        - name: Idempotency-Key
          in: header
          schema:
            type: string
          description: A unique key to ensure the request is processed only once.
          example: 53fe209b096f2d10ba0c08a4
      requestBody:
        description: License objects to be created.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                licenses:
                  type: array
                  maximum: 150
                  minimum: 1
                  items:
                    $ref: "#/components/schemas/CreateLicense"
            examples:
              BatchLicenseCreateRequestExample:
                $ref: "#/components/examples/BatchLicenseCreateRequestExample"
      responses:
        "202":
          description: Licenses are being created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      batchId:
                        type: string
                      status:
                        type: string
                        enum:
                          - processing
                          - completed
                      operation:
                        type: string
                        enum:
                          - create
                          - update
                      getBatchStatusURL:
                        type: string
              examples:
                BatchLicenseCreateResponseExample:
                  $ref: "#/components/examples/BatchLicenseCreateResponseExample"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/responses/NotFound"
              examples:
                notFoundExample:
                  value:
                    success: false
                    message: Account not found
                    data: []

  /accounts/{accountId}/access-widget-licenses/batch-update:
    post:
      summary: Update multiple accessWidget licenses
      description: |
        Updates multiple existing accessWidget licenses for the specified account. The maximum number of licenses that can be updated in a single request is 150.

        This endpoint requires the `x-api-key` header for authentication. The key must match the API key associated with the specified account. The account must also be a partner account.
      security:
        - X-API-Key: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the account. You can check your ID [here](https://dashboard.accessibe.com/app/account).
          example: 6655ffde924acc9586252c9e
        - name: Idempotency-Key
          in: header
          schema:
            type: string
          description: A unique key to ensure the request is processed only once.
          example: 53fe209b096f2d10ba0c08a4
      requestBody:
        description: License objects to be updated
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                licenses:
                  type: array
                  maximum: 150
                  minimum: 1
                  items:
                    $ref: "#/components/schemas/UpdateLicense"
            examples:
              BatchLicenseUpdateRequestExample:
                $ref: "#/components/examples/BatchLicenseUpdateRequestExample"
      responses:
        "202":
          description: Licenses are being updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      batchId:
                        type: string
                      status:
                        type: string
                        enum:
                          - processing
                          - completed
                      operation:
                        type: string
                        enum:
                          - create
                          - update
                      getBatchStatusURL:
                        type: string
              examples:
                BatchLicenseCreateResponseExample:
                  $ref: "#/components/examples/BatchLicenseUpdateResponseExample"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/responses/NotFound"
              examples:
                notFoundExample:
                  value:
                    success: false
                    message: Account not found
                    data: []

  /accounts/{accountId}/access-widget-licenses/batch/{batchId}:
    get:
      summary: Get batch operation status
      description: |
        Gets the status of a batch operation for creating or updating accessWidget licenses. Use the batchId from the response of either POST /accounts/{accountId}/access-widget-licenses/batch-create or POST /accounts/{accountId}/access-widget-licenses/batch-update.

        This endpoint requires the `x-api-key` header for authentication. The key must match the API key associated with the specified account. The account must also be a partner account.
      security:
        - X-API-Key: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the account. You can check your ID [here](https://dashboard.accessibe.com/app/account).
          example: 6655ffde924acc9586252c9e
        - name: batchId
          in: query
          required: true
          schema:
            type: string
          description: The ID of the batch operation.
          example: 6655ffdaaf3c1a7b866ad60b
      responses:
        "200":
          description: Batch operation found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/GetBatchStatus"
              examples:
                GetBatchStatusCompletedExample:
                  $ref: "#/components/examples/GetBatchStatusCompletedExample"
        "202":
          description: Batch operation is being processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/GetBatchStatus"
              examples:
                GetBatchStatusCompletedExample:
                  $ref: "#/components/examples/GetBatchStatusProcessingExample"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Batch operation not found
          content:
            application/json:
              schema:
                $ref: "#/components/responses/NotFound"
              examples:
                notFoundExample:
                  value:
                    success: false
                    message: Batch operation not found
